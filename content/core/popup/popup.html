<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VPN AFJAL ULTRA 100K</title>
  <style>
    body {
      width: 230px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #020617;
      color: #38bdf8;
      text-align: center;
      margin: 0;
    }
    h2 { font-size: 16px; margin: 0 0 5px 0; color: #ef4444; text-shadow: 0 0 10px #ef4444; }
    p { font-size: 11px; color: #94a3b8; margin-bottom: 15px; }
    .box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      color: #f8fafc;
      font-size: 13px;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #22c55e;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>⚡ VPN AFJAL ⚡</h2>
  <p>ULTRA 100K MIC OVERDRIVE</p>
  
  <div class="box">
    <div class="switch">
      <span>MIC BOOST</span>
      <input type="checkbox" id="toggleBoost" checked>
    </div>
    <div id="status" style="margin-top: 8px; font-size: 11px; color: #22c55e;">STATUS: MAX POWER</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
